name: Deploy Publish Image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Display tag information
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Git ref:     ${{ github.ref }}"
          echo "Tag:         ${{ github.ref_name }}"

      # ----------------------------------------
      # Checkout source at the exact tag
      # ----------------------------------------
      - name: Checkout tagged source code
        uses: actions/checkout@v4

      # ----------------------------------------
      # Setup Java
      # ----------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # ----------------------------------------
      # Build Spring Boot JAR
      # ----------------------------------------
      - name: Build application
        run: |
          mvn clean package -DskipTests

      # ----------------------------------------
      # Verify JAR
      # ----------------------------------------
      - name: Verify generated JAR
        shell: bash
        run: |
          echo "Generated files:"
          find target -maxdepth 2 -type f -print

          JAR_FILE=$(find target \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            ! -name "original-*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "No deployable JAR file was found"
            exit 1
          fi

          echo "JAR file found: $JAR_FILE"

      # ----------------------------------------
      # Login to GHCR
      # ----------------------------------------
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------
      # Generate image metadata
      # ----------------------------------------
      - name: Generate Docker image metadata
        id: metadata
        shell: bash
        run: |
          TAG_NAME="${{ github.ref_name }}"

          OWNER_LOWER=$(echo "${{ github.repository_owner }}" \
            | tr '[:upper:]' '[:lower:]')

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "owner_lower=$OWNER_LOWER" >> "$GITHUB_OUTPUT"

          echo "Docker tag: $TAG_NAME"
          echo "GHCR owner: $OWNER_LOWER"

      # ----------------------------------------
      # Build image
      # ----------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            --tag "ghcr.io/${{ steps.metadata.outputs.owner_lower }}/bwm-java-demo-k8s:${{ steps.metadata.outputs.tag_name }}" \
            --tag "ghcr.io/${{ steps.metadata.outputs.owner_lower }}/bwm-java-demo-k8s:latest" \
            .

      # ----------------------------------------
      # Push version tag
      # ----------------------------------------
      - name: Push version image
        run: |
          docker push \
            "ghcr.io/${{ steps.metadata.outputs.owner_lower }}/bwm-java-demo-k8s:${{ steps.metadata.outputs.tag_name }}"

      # ----------------------------------------
      # Push latest
      # ----------------------------------------
      - name: Push latest image
        run: |
          docker push \
            "ghcr.io/${{ steps.metadata.outputs.owner_lower }}/bwm-java-demo-k8s:latest"

      # ----------------------------------------
      # Deployment repo work
      # ----------------------------------------
      - name: Checkout Deployment Repo
        run: |
          echo "checked out"

      - name: Change tag in Deployment repo
        run: |
          echo "New image tag: ${{ github.ref_name }}"